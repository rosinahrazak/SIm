<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shooter</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06060f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #000;
    box-shadow: 0 0 40px rgba(0, 200, 255, 0.25);
  }
</style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const ROWS = 5, COLS = 8;
const ALIEN_W = 30, ALIEN_H = 22, ALIEN_GAP = 14;
const ALIEN_COLORS = ['#7ef9c0', '#a7f97e', '#ffd166', '#ff9f6e', '#ff8fa3'];

// 11x8 pixel-art bitmap for an invader
const INVADER = [
  '..X.....X..',
  '...X...X...',
  '..XXXXXXX..',
  '.XX.XXX.XX.',
  'XXXXXXXXXXX',
  'X.XXXXXXX.X',
  'X.X.....X.X',
  '...XX.XX...'
];

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.5 + 0.3,
  a: Math.random() * 0.7 + 0.3
}));

let state, score, lives, wave;
let player, bullets, alienBullets, aliens, particles, moveDir, alienTimer, shootCooldown;
const keys = {};

function initWave() {
  aliens = [];
  const totalW = COLS * (ALIEN_W + ALIEN_GAP) - ALIEN_GAP;
  const startX = (W - totalW) / 2;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      aliens.push({
        x: startX + col * (ALIEN_W + ALIEN_GAP),
        y: 70 + row * (ALIEN_H + ALIEN_GAP),
        col, row, alive: true
      });
    }
  }
  moveDir = 1;
  alienTimer = 1;
}

function reset() {
  score = 0;
  lives = 3;
  wave = 1;
  player = { x: W / 2 - 20, y: H - 46, w: 40, h: 28, speed: 300, invuln: 0 };
  bullets = [];
  alienBullets = [];
  particles = [];
  shootCooldown = 0;
  initWave();
}

function startGame() {
  reset();
  state = 'playing';
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.4 + Math.random() * 0.2,
      color
    });
  }
}

function update(dt) {
  // player movement
  if (keys['ArrowLeft']) player.x -= player.speed * dt;
  if (keys['ArrowRight']) player.x += player.speed * dt;
  player.x = Math.max(4, Math.min(W - player.w - 4, player.x));
  if (player.invuln > 0) player.invuln -= dt;

  // firing
  shootCooldown -= dt;
  if (keys[' '] && shootCooldown <= 0 && bullets.length < 3) {
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
    shootCooldown = 0.3;
  }
  for (const b of bullets) b.y -= 440 * dt;
  bullets = bullets.filter(b => b.y + b.h > 0);

  // alien fleet march: faster as fewer aliens remain, and each wave is faster
  const alive = aliens.filter(a => a.alive);
  const total = ROWS * COLS;
  const speed = 25 + wave * 15 + (1 - alive.length / total) * 110;
  let minX = Infinity, maxX = -Infinity;
  for (const a of alive) {
    a.x += moveDir * speed * dt;
    minX = Math.min(minX, a.x);
    maxX = Math.max(maxX, a.x + ALIEN_W);
  }
  if (alive.length && ((moveDir > 0 && maxX > W - 6) || (moveDir < 0 && minX < 6))) {
    moveDir *= -1;
    for (const a of alive) a.y += 16;
  }

  // alien shooting: bottom alien of a random occupied column fires
  alienTimer -= dt;
  if (alienTimer <= 0 && alive.length) {
    alienTimer = Math.max(0.25, (0.9 - wave * 0.08)) * (0.5 + Math.random());
    const byCol = new Map();
    for (const a of alive) {
      const cur = byCol.get(a.col);
      if (!cur || a.y > cur.y) byCol.set(a.col, a);
    }
    const shooters = [...byCol.values()];
    const s = shooters[Math.floor(Math.random() * shooters.length)];
    alienBullets.push({ x: s.x + ALIEN_W / 2 - 2, y: s.y + ALIEN_H, w: 4, h: 12 });
  }
  for (const b of alienBullets) b.y += (200 + wave * 25) * dt;
  alienBullets = alienBullets.filter(b => b.y < H);

  // player bullets vs aliens
  for (const b of bullets) {
    for (const a of aliens) {
      if (!a.alive) continue;
      if (b.x < a.x + ALIEN_W && b.x + b.w > a.x && b.y < a.y + ALIEN_H && b.y + b.h > a.y) {
        a.alive = false;
        b.dead = true;
        score += (a.row + 1) * 10;
        spawnExplosion(a.x + ALIEN_W / 2, a.y + ALIEN_H / 2, ALIEN_COLORS[a.row]);
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // alien bullets vs player
  if (player.invuln <= 0) {
    for (const b of alienBullets) {
      if (b.x < player.x + player.w && b.x + b.w > player.x &&
          b.y < player.y + player.h && b.y + b.h > player.y) {
        lives--;
        spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#5ad1ff');
        alienBullets = [];
        if (lives <= 0) {
          state = 'gameover';
        } else {
          player.x = W / 2 - 20;
          player.invuln = 2;
        }
        break;
      }
    }
  }

  // aliens reaching the player means instant game over
  for (const a of aliens) {
    if (a.alive && a.y + ALIEN_H >= player.y) {
      lives = 0;
      state = 'gameover';
    }
  }

  // wave cleared
  if (alive.length === 0) {
    wave++;
    initWave();
    alienBullets = [];
  }

  // particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawShip() {
  const { x, y, w, h } = player;
  ctx.fillStyle = '#5ad1ff';
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#dff4ff';
  ctx.fillRect(x + w / 2 - 2, y + 6, 4, 8);
  ctx.fillStyle = '#ff9f6e'; // engine flame
  ctx.fillRect(x + w / 2 - 3, y + h, 6, 5);
}

function drawInvader(a) {
  const px = ALIEN_W / 11;
  ctx.fillStyle = ALIEN_COLORS[a.row];
  for (let r = 0; r < INVADER.length; r++) {
    for (let c = 0; c < 11; c++) {
      if (INVADER[r][c] === 'X') {
        ctx.fillRect(a.x + c * px, a.y + r * (ALIEN_H / 8), px, ALIEN_H / 8);
      }
    }
  }
}

function drawText(text, x, y, size, color, align) {
  ctx.font = `bold ${size}px monospace`;
  ctx.textAlign = align || 'left';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  if (state === 'playing' || state === 'gameover') {
    // HUD
    drawText('SCORE ' + score, 14, 28, 18, '#fff');
    drawText('WAVE ' + wave, W / 2, 28, 18, '#ffd166', 'center');
    drawText('LIVES ' + '♥'.repeat(Math.max(0, lives)), W - 14, 28, 20, '#ff8fa3', 'right');
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.lineTo(W, 40);
    ctx.stroke();

    for (const a of aliens) if (a.alive) drawInvader(a);

    ctx.fillStyle = '#7ef9c0';
    for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ff5d5d';
    for (const b of alienBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' && (player.invuln <= 0 || Math.floor(player.invuln * 10) % 2 === 0)) {
      drawShip();
    }
  }

  if (state === 'ready') {
    drawText('SPACE SHOOTER', W / 2, 210, 42, '#5ad1ff', 'center');
    drawText('Move: LEFT / RIGHT arrow keys', W / 2, 300, 16, '#ccc', 'center');
    drawText('Fire: SPACE', W / 2, 330, 16, '#ccc', 'center');
    drawText('Press ENTER to start', W / 2, 400, 20, '#ffd166', 'center');
  } else if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    drawText('GAME OVER', W / 2, 240, 46, '#ff5d5d', 'center');
    drawText('FINAL SCORE: ' + score, W / 2, 300, 22, '#fff', 'center');
    drawText('Press ENTER to play again', W / 2, 370, 18, '#ffd166', 'center');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'Enter' && (state === 'ready' || state === 'gameover')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

state = 'ready';
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
